[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muleguard"
version = "1.0.0"
description = "MuleGuard (Trinetra engine) - AI/ML classification of suspicious mule accounts. PS2, Bank of India x IIT Hyderabad Hackathon 2026. Team Kryptonite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17",
    "fastexcel>=0.11",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2.7",
    "optuna>=4.0",
    "shap>=0.46",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "jinja2>=3.1",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
