# Local LLM narrator configuration. The LLM is OPTIONAL and can only narrate
# verified structured facts; it can never compute or change scores/tiers.
enabled: true
base_url: "http://localhost:11434"
# Preferred model order: first available wins. qwen3.5 not published for
# Ollama; on CPU-only hardware a small non-thinking model narrates fastest,
# so llama3.2:3b leads (qwen3:8b spends its budget on thinking tokens at
# ~CPU speeds - measured during build; kept as fallback with think off).
model_preference:
  - "llama3.2:3b"
  - "phi4-mini:latest"
  - "qwen3:8b"
temperature: 0.0
max_tokens: 500
# measured: llama3.2:3b narrator call ~48s on this CPU incl. model load
timeout_seconds: 120
retries: 1
circuit_breaker:
  failure_threshold: 3      # consecutive failures -> open circuit
  cooldown_seconds: 300
